name: ESP32-S3 runtime

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/esp32-runtime.yml'
      - 'scripts/fetch-esp32sim-runtime.mjs'
      - 'src/firmware/esp32-runtime.ts'

permissions:
  contents: write

concurrency:
  group: esp32-runtime
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patched esp32sim WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          UPSTREAM_SHA=d5446b4aa9a1b035aff74eba082611822676f285
          git clone https://github.com/joakimeriksson/esp32sim.git /tmp/esp32sim
          cd /tmp/esp32sim
          git checkout "$UPSTREAM_SHA"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('wasm/src/lib.rs')
          s = p.read_text()
          marker = '/// The page is the one client: messages queue in a `WebServer` sink; the worker paces the run.\n'
          patch = r'''
/// Ohmlet bridge: current GPIO output latch and output-enable masks for the
/// ESP32-S3. JavaScript receives u64 exports as BigInt. Other chips return 0.
#[no_mangle]
pub unsafe extern "C" fn esp32sim_gpio_out(e: *mut Emu) -> u64 {
    if e.is_null() { return 0; }
    let emu = unsafe { &mut *e };
    emu.m.as_any_mut().downcast_mut::<esp32s3::Machine>()
        .map(|m| m.bus.periph.gpio.out).unwrap_or(0)
}
#[no_mangle]
pub unsafe extern "C" fn esp32sim_gpio_enable(e: *mut Emu) -> u64 {
    if e.is_null() { return 0; }
    let emu = unsafe { &mut *e };
    emu.m.as_any_mut().downcast_mut::<esp32s3::Machine>()
        .map(|m| m.bus.periph.gpio.enable).unwrap_or(0)
}
'''
          if 'esp32sim_gpio_enable' not in s:
              if marker not in s:
                  raise SystemExit('esp32sim wasm patch marker not found')
              s = s.replace(marker, patch + '\n' + marker)
              p.write_text(s)

          w = Path('web/wasm/worker.js')
          s = w.read_text()
          old = 'let wasm = null, emu = 0, running = false, t0 = 0, resyncs = 0, lastStat = { wall: 0, insns: 0, cycles: 0 };'
          new = old + '\nlet lastGpioOut = -1n, lastGpioEnable = -1n;\nfunction pushGpio() {\n  if (!emu || !wasm.esp32sim_gpio_out || !wasm.esp32sim_gpio_enable) return;\n  const out = wasm.esp32sim_gpio_out(emu), enable = wasm.esp32sim_gpio_enable(emu);\n  if (out === lastGpioOut && enable === lastGpioEnable) return;\n  lastGpioOut = out; lastGpioEnable = enable;\n  postMessage({ gpio: { out: out.toString(16), enable: enable.toString(16) } });\n}\n'
          if 'function pushGpio()' not in s:
              if old not in s:
                  raise SystemExit('esp32sim worker state marker not found')
              s = s.replace(old, new)
              needle = '    drain();\n'
              if needle not in s:
                  raise SystemExit('esp32sim worker drain marker not found')
              s = s.replace(needle, needle + '    pushGpio();\n', 1)
              s = s.replace("      pendingInputTrace = [];\n", "      pendingInputTrace = [];\n      lastGpioOut = -1n; lastGpioEnable = -1n;\n", 1)
              w.write_text(s)
          PY

          rustup target add wasm32-unknown-unknown
          tools/wasm-build.sh

          mkdir -p /tmp/ohmlet-esp32-runtime
          cp web/wasm/esp32sim.wasm /tmp/ohmlet-esp32-runtime/
          cp web/wasm/worker.js /tmp/ohmlet-esp32-runtime/
          cp web/wasm/jit.mjs /tmp/ohmlet-esp32-runtime/
          cp web/wasm/pacing.mjs /tmp/ohmlet-esp32-runtime/
          curl -fL https://joakimeriksson.github.io/esp32sim/wasm/fw/esp32s3_rev0_rom.elf -o /tmp/ohmlet-esp32-runtime/esp32s3_rev0_rom.elf
          ls -lh /tmp/ohmlet-esp32-runtime

      - name: Publish runtime branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan runtime
          git rm -rf .
          cp /tmp/ohmlet-esp32-runtime/* .
          cat > README.md <<'EOF'
          # Ohmlet ESP32-S3 runtime

          Generated from joakimeriksson/esp32sim at pinned commit
          `d5446b4aa9a1b035aff74eba082611822676f285`, with two read-only WebAssembly
          exports for the ESP32-S3 GPIO output latch and output-enable mask.
          The runtime is generated by `.github/workflows/esp32-runtime.yml` on
          `develop`; do not edit this branch manually.
          EOF
          git add .
          git commit -m 'runtime: ESP32-S3 WebAssembly with GPIO bridge'
          git push --force origin runtime
