name: ESP32-S3 runtime

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/esp32-runtime.yml'
      - 'scripts/build-esp32-runtime.sh'

permissions:
  contents: write

concurrency:
  group: esp32-runtime
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build patched esp32sim WebAssembly
        run: bash scripts/build-esp32-runtime.sh

      - name: Publish runtime branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan runtime
          git rm -rf .
          cp /tmp/ohmlet-esp32-runtime/* .
          printf '%s\n' '# Ohmlet ESP32-S3 runtime' '' 'Generated from pinned joakimeriksson/esp32sim with read-only GPIO output/enable WebAssembly exports. Do not edit this branch manually.' > README.md
          git add .
          git commit -m 'runtime: ESP32-S3 WebAssembly with GPIO bridge'
          git push --force origin runtime
