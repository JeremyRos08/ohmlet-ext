services:
  - type: web
    runtime: static
    name: ohmlet-mobile
    repo: https://github.com/JeremyRos08/ohmlet-ext
    branch: develop
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
